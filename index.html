    <style>
        /* ===== 1. VARIABLES & RESET - Lines 1-60 ===== */
        :root {
            --primary: #2563eb; --primary-dark: #1e40af; --primary-light: #3b82f6;
            --secondary: #7c3aed; --accent: #f59e0b; --success: #10b981;
            --danger: #ef4444; --dark: #0f172a; --dark-800: #1e293b;
            --dark-700: #334155; --light: #f8fafc; --light-200: #e2e8f0;
            --light-300: #cbd5e1; --gray-500: #64748b; --gray-600: #475569;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12); --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12); --shadow-xl: 0 20px 50px rgba(0,0,0,0.15);
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 100px; font-size: 16px; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7; color: var(--dark); background: var(--light);
            transition: var(--transition); overflow-x: hidden;
        }
        body.dark { background: var(--dark); color: var(--light); }
        img { max-width: 100%; height: auto; display: block; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }
        button, input, textarea { font-family: inherit; }
        .container { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
        
        /* ===== 2. PRELOADER - Lines 61-90 ===== */
        #preloader {
            position: fixed; inset: 0; background: var(--dark); z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s, visibility 0.5s;
        }
        #preloader.hidden { opacity: 0; visibility: hidden; }
        .loader {
            width: 60px; height: 60px; border: 4px solid var(--dark-700);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ===== 3. NAVBAR - Lines 91-180 ===== */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            box-shadow: var(--shadow-md); transition: var(--transition);
        }
        body.dark .navbar { background: rgba(15, 23, 42, 0.95); }
        .nav-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 0;
        }
        .logo {
            font-size: 1.75rem; font-weight: 800; display: flex; align-items: center; gap: 10px;
        }
        .logo-icon {
            width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.3rem;
        }
        .nav-menu { display: flex; align-items: center; gap: 2.5rem; }
        .nav-link {
            font-weight: 600; font-size: 0.95rem; position: relative;
            padding: 8px 0; color: var(--dark);
        }
        body.dark .nav-link { color: var(--light); }
        .nav-link::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px; transition: var(--transition);
        }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .nav-link:hover { color: var(--primary); }
        .theme-toggle {
            width: 48px; height: 48px; border-radius: var(--radius-md);
            background: var(--light-200); border: 2px solid transparent;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; cursor: pointer; transition: var(--transition);
        }
        body.dark .theme-toggle { background: var(--dark-800); }
        .theme-toggle:hover { border-color: var(--primary); transform: rotate(180deg); }
        
        /* ===== 4. HERO - Lines 181-320 ===== */
        .hero {
            min-height: 100vh; display: flex; align-items: center; position: relative;

        .hero-title {

        .hero-img-wrap { position: relative; animation: fadeInRight 1s ease-out 0.3s both; }

        .hero-img-box { position: relative; width: fit-content; margin: 0 auto; }
        .hero-img-bg {

        .float-badge {

        .skills-wrap { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3.5rem; }

        /* ===== 7. PROJECTS - Lines 561-720 ===== */
        .filter-wrap {

        /* ===== 8. TIMELINE - Lines 721-840 ===== */
